# $schema: https://opendatafabric.org/schemas/flows/v1alpha1/Flow
$schema: https://opendatafabric.org/schemas/flows/v1alpha1/Flow
headers:
  name: sensor.temp.http
spec:
  target: Dataset:ca.bankofcanada
  triggers:
    - kind: Event
      events:
        type: dataset.ref.updated
  tasks:
    - kind: WebhookCall
      target: com.example.hook
      payload: '${{ trigger.event }}'
      retryPolicy:  # Task-level retries
        maxAttempts: 3
  retryPolicy:  # Flow-level retries
    maxAttempts: 3
    minDelay: 1min
    backoff: Exponential


# TODO!: Events should have ODF schemas too

# TODO!: Special type for strings that support templating?
