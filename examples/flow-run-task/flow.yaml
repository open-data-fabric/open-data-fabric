# $schema: https://opendatafabric.org/schemas/flows/v1alpha1/Flow
$schema: https://opendatafabric.org/schemas/flows/v1alpha1/Flow
headers:
  name: update-all-deriv
spec:
  target:
    type: Dataset
    name: '%'
    labels:
      kind: Derivative
  triggers:
    - kind: Schedule
      cron: "@daily"
  tasks:
    - kind: Transform
    - kind: GarbageCollection
      name: gc
