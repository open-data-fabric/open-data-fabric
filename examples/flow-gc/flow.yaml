# $schema: https://opendatafabric.org/schemas/flows/v1alpha1/Flow
$schema: https://opendatafabric.org/schemas/flows/v1alpha1/Flow
headers:
  name: gc-datasets
spec:
  target: Dataset:%  # Matches all dataset of the subject account
  triggers:
    - kind: Schedule
      cron: "@daily"
  tasks:
    - kind: GarbageCollection
