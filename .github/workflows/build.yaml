name: build
on:
  push:
    paths:
      - "**"
      # - "!docs/**"
  # manual trigger
  workflow_dispatch: { }
jobs:

  lint_schemas:
    name: Lint / Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - run: |
          make lint-schemas

  lint_codegen:
    name: Lint / Codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Generate artifacts
        run: make codegen
      - name: Check generated files
        run: git diff && git diff-index --quiet HEAD

  lint_markdown:
    name: Lint / Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Check links
        run: nix develop ./tools/nix --command make lint-markdown
